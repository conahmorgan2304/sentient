name: Release

# Publishes a GitHub release (which HACS reads) whenever the version in manifest.json changes on main.
on:
  push:
    branches: [main]
    paths:
      - custom_components/sentient/manifest.json
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Read the version
        id: v
        run: echo "version=$(python3 -c "import json;print(json.load(open('custom_components/sentient/manifest.json'))['version'])")" >> "$GITHUB_OUTPUT"
      - name: Skip if already released
        id: seen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.v.outputs.version }}" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.seen.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
