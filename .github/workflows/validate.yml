name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  release-version:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Remind maintainers when integration changes are not released
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess

          base = os.environ['BASE_SHA']
          head = os.environ['HEAD_SHA']
          path = 'custom_components/sentient/manifest.json'
          changed = subprocess.check_output(['git', 'diff', '--name-only', base + '...' + head], text=True).splitlines()
          if any(p.startswith('custom_components/sentient/') for p in changed):
              def version(ref):
                  return json.loads(subprocess.check_output(['git', 'show', ref + ':' + path], text=True))['version']
              if version(base) == version('HEAD'):
                  print('::warning::Integration changes without a manifest version bump will not publish a new HACS release. Bump the version if this PR is intended to release.')
                  with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                      summary.write('### Release reminder\n\nIntegration changed without a version bump. Merge will not publish a new HACS release.\n')
          PY

  hassfest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  tests:
    runs-on: ubuntu-latest
    # a hung test fails the run instead of holding a runner for GitHub's six-hour default
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -r requirements_test.txt
      - run: pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # the page checks (tests/panel_pages.test.cjs) open the panel in a browser against what pytest recorded
      # from the real integration (tests/test_panel_fixture.py -> build/panel/)
      - run: npm install --no-save eslint@9.14.0 globals@15.12.0 playwright@1.63.0 && npx playwright install --with-deps chromium
      - run: node --test tests/*.test.cjs
      - run: npx eslint custom_components/sentient/frontend

  home-assistant-compatibility:
    name: Home Assistant ${{ matrix.core }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - core: "2025.10.0"
            python: "3.13"
            harness: "0.13.285"
            conversation: "pycares<5 hassil==3.2.0 home-assistant-intents==2025.10.1"
          - core: "2026.10.4"
            python: "3.14"
            harness: "0.13.375"
            conversation: "gazetteer-matcher==1.1.0 hassil==3.12.1 home-assistant-intents==2026.10.6"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install the matching Home Assistant test harness
        env:
          HARNESS_VERSION: ${{ matrix.harness }}
          CONVERSATION_DEPS: ${{ matrix.conversation }}
        run: |
          read -r -a conversation_deps <<< "$CONVERSATION_DEPS"
          pip install "pytest-homeassistant-custom-component==$HARNESS_VERSION" "${conversation_deps[@]}" \
            PyTurboJPEG 'pypdf>=5.1.0' num2words==0.5.14
      - name: Check setup, voice, safety and recovery
        run: |
          pytest -q tests/test_config_flow.py tests/test_voice_retry.py tests/test_voice_grounding.py \
            tests/test_safety_and_delivery.py tests/test_privacy.py tests/test_websocket.py \
            tests/test_window_heating.py tests/test_maintenance.py
