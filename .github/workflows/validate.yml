name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  hassfest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  tests:
    runs-on: ubuntu-latest
    # a hung test fails the run instead of holding a runner for GitHub's six-hour default
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -r requirements_test.txt
      - run: pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # the page checks (tests/panel_pages.test.cjs) open the panel in a browser against what pytest recorded
      # from the real integration (tests/test_panel_fixture.py -> build/panel/)
      - run: npm install --no-save eslint@9.14.0 globals@15.12.0 playwright@1.63.0 && npx playwright install --with-deps chromium
      - run: node --test tests/*.test.cjs
      - run: npx eslint custom_components/sentient/frontend
