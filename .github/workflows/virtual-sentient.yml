name: Virtual Sentient fixtures

on:
  pull_request:
    paths:
      - 'scripts/replay/virtual_suite.py'
      - 'scripts/test_virtual_suite.py'
      - '.github/workflows/virtual-sentient.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run isolated fixture tests (stdlib unittest-free runner)
        run: |
          python scripts/replay/virtual_suite.py --out /tmp/sentient-virtual --generate-only
          python -m compileall -q scripts/replay/virtual_suite.py scripts/test_virtual_suite.py
          python -m pip install pytest
          python -m pytest -q scripts/test_virtual_suite.py
      - name: Save fixture report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: virtual-sentient-fixtures
          path: /tmp/sentient-virtual/report.json
