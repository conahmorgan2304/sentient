say:
  fields:
    message:
      required: true
      example: "The washing has finished."
      selector:
        text:
          multiline: true
    priority:
      default: normal
      selector:
        select:
          options: [low, normal, urgent]
          translation_key: priority
    speaker:
      example: kitchen
      selector:
        text:
remember:
  fields:
    text:
      required: true
      example: "The rabbits' hutch is by the shed."
      selector:
        text:
    category:
      default: fact
      selector:
        select:
          options: [fact, preference, person, routine, note]
          translation_key: category
forget:
  fields:
    what:
      required: true
      example: "rabbit hutch"
      selector:
        text:
watch:
  fields:
    what:
      required: true
      example: "the cats near the rabbit pen"
      selector:
        text:
    entity:
      required: true
      example: camera.garden
      selector:
        text:
    to_state:
      example: "off"
      selector:
        text:
    above:
      selector:
        number:
          mode: box
          step: any
    below:
      selector:
        number:
          mode: box
          step: any
    question:
      example: "Are any cats near the rabbit pen?"
      selector:
        text:
    look_for:
      example: cat
      selector:
        text:
    message:
      selector:
        text:
    until:
      example: "18:00"
      selector:
        text:
    minutes:
      selector:
        number:
          min: 1
          max: 10080
          mode: box
    repeat:
      default: false
      selector:
        boolean:
    priority:
      default: normal
      selector:
        select:
          options: [low, normal, urgent]
          translation_key: priority
    speaker:
      selector:
        text:
    wake_on:
      example: binary_sensor.front_garden_person_occupancy
      selector:
        text:
    spot:
      example: rabbit pen
      selector:
        text:
cancel_watch:
  fields:
    what:
      required: true
      example: "cats"
      selector:
        text:
remind:
  fields:
    message:
      required: true
      example: "Time to put the oven on."
      selector:
        text:
    at:
      example: "18:00"
      selector:
        text:
    minutes:
      selector:
        number:
          min: 1
          max: 10080
          mode: box
    speaker:
      selector:
        text:
    priority:
      default: urgent
      selector:
        select:
          options: [low, normal, urgent]
          translation_key: priority
ask:
  fields:
    question:
      required: true
      example: "Fancy a brew? Shall I put the kettle on?"
      selector:
        text:
    priority:
      default: normal
      selector:
        select:
          options: [low, normal, urgent]
          translation_key: priority
    speaker:
      example: kitchen
      selector:
        text:
    extra_prompt:
      selector:
        text:
          multiline: true
    preannounce:
      default: false
      selector:
        boolean:
learn:
briefing:
  fields:
    speak:
      default: true
      selector:
        boolean:
    priority:
      default: normal
      selector:
        select:
          options: [low, normal, urgent]
          translation_key: priority
